# Official Workload B proportions and Zipfian generator, with the same fixed
# 4KiB one-field overwrite adapter and all other settings used for Workload A.
workload=site.ycsb.workloads.CoreWorkload
recordcount=1048576
operationcount=1000000000
fieldcount=1
fieldlength=4096
fieldlengthdistribution=constant
readallfields=true
writeallfields=true
readproportion=0.95
updateproportion=0.05
scanproportion=0
insertproportion=0
readmodifywriteproportion=0
requestdistribution=zipfian
insertorder=hashed
dataintegrity=false
measurementtype=hdrhistogram
status.interval=10
rados.record_bytes=4096
