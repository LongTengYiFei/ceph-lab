# Official YCSB Workload A proportions and Zipfian distribution.
# One fixed-size field makes each successful insert/update exactly 4096 RADOS bytes.
workload=site.ycsb.workloads.CoreWorkload
recordcount=1048576
operationcount=1000000000
fieldcount=1
fieldlength=4096
fieldlengthdistribution=constant
readallfields=true
writeallfields=true
readproportion=0.5
updateproportion=0.5
scanproportion=0
insertproportion=0
readmodifywriteproportion=0
requestdistribution=zipfian
insertorder=hashed
dataintegrity=false
measurementtype=hdrhistogram
status.interval=10
rados.record_bytes=4096
